<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LaunchBrain — Robinhood Chain launch terminal</title>
<meta name="description" content="A terminal for tracking new token launches on Robinhood Chain, that files what you find into your second brain.">
<style>
:root{
  --bg:#0A0C0F; --panel:#11151B; --panel2:#151A21; --line:#1F262F;
  --tx:#C6D0DA; --dim:#7A8794; --faint:#4E5A66;
  --up:#5FD08C; --down:#E06A5E; --warn:#E0B04A; --acc:#5AC8E0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);
  font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,"DejaVu Sans Mono",monospace;
  height:100vh;display:flex;flex-direction:column;overflow:hidden}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#222A33;border-radius:4px}

header{border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto}
.top{display:flex;align-items:center;gap:16px;padding:9px 14px}
.brand{font-weight:700;letter-spacing:-.02em;font-size:14px}
.brand i{font-style:normal;color:var(--acc)}
.meta{color:var(--faint);font-size:11.5px}
.meta b{color:var(--dim);font-weight:400}
.grow{flex:1}
input[type=search]{background:var(--panel2);border:1px solid var(--line);border-radius:3px;
  color:var(--tx);padding:6px 9px;width:190px;font:inherit}
input[type=search]::placeholder{color:var(--faint)}

.fchip{white-space:nowrap}
.fchip::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--faint);margin-right:4px;vertical-align:middle}
.fchip.ok::before{background:var(--up)}
.fchip.slow::before{background:var(--warn)}
.fchip.down::before{background:var(--down)}

.tabs{display:flex;gap:2px;padding:0 10px}
.tabs button{padding:7px 13px;color:var(--dim);border-bottom:2px solid transparent;font-size:12.5px}
.tabs button.on{color:var(--tx);border-bottom-color:var(--acc)}
.tabs button b{color:var(--faint);font-weight:400;margin-left:6px;font-size:11px}

.filters{display:flex;gap:6px;padding:7px 14px;border-top:1px solid var(--line);
  align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:12px;padding:3px 10px;color:var(--dim);font-size:11.5px}
.chip.on{background:#16303A;border-color:#27596B;color:#9FE2F2}
#pend{display:none;border-color:#4A4327;color:var(--warn)}

main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 356px;min-height:0}
@media(max-width:980px){main{grid-template-columns:1fr}#detail{display:none}
  main.detail #list{display:none}main.detail #detail{display:block}}
#list{overflow:auto;min-height:0}
table{min-width:940px}
table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:0;background:var(--panel);z-index:2;text-align:right;
  padding:6px 8px;font-weight:400;color:var(--faint);font-size:11px;cursor:pointer;
  border-bottom:1px solid var(--line);white-space:nowrap}
thead th:first-child,thead th:nth-child(2){text-align:left}
thead th.s{color:var(--acc)}
tbody td{padding:5px 8px;border-bottom:1px solid #141920;text-align:right;white-space:nowrap}
tbody td:first-child,tbody td:nth-child(2){text-align:left}
tbody tr{cursor:pointer}
tbody tr:hover{background:#141A21}
tbody tr.sel{background:#16202A}
.sym{font-weight:700}
.nm{color:var(--dim);font-size:11.5px;max-width:160px;overflow:hidden;text-overflow:ellipsis;display:block}
.up{color:var(--up)}.down{color:var(--down)}.warn{color:var(--warn)}.dim{color:var(--dim)}
.tag{font-size:10px;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--faint)}
.tag.spam{border-color:#4A2B28;color:var(--down)}
.tag.x{border-color:#27596B;color:#9FE2F2}
.tag.new{border-color:#2E5A3A;color:var(--up)}
.bar{width:52px;height:5px;background:#1B222A;border-radius:3px;display:inline-block;
  overflow:hidden;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--acc)}
.bar i.done{background:var(--up)}
.star{color:var(--faint);padding:0 4px}
.star.on{color:var(--warn)}

@keyframes lbfl{from{background:#223041}to{background:transparent}}
@keyframes lbflu{from{background:#173322}to{background:transparent}}
@keyframes lbfld{from{background:#37201C}to{background:transparent}}
td.fl{animation:lbfl .9s}
td.flu{animation:lbflu .9s}
td.fld{animation:lbfld .9s}

#detail{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px}
.dh{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.dh h2{font-size:19px;letter-spacing:-.01em}
.dsub{color:var(--dim);font-size:12px;margin-bottom:12px}
.spark{width:100%;height:74px;margin:6px 0 14px;background:var(--panel2);
  border:1px solid var(--line);border-radius:3px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:3px;margin-bottom:14px}
.kv div{background:var(--panel2);padding:7px 9px}
.kv span{display:block;color:var(--faint);font-size:10.5px}
.kv b{font-weight:400;font-size:13.5px}
h4{font-size:10.5px;color:var(--faint);letter-spacing:.09em;margin:14px 0 6px;font-weight:600}
.flags{display:flex;flex-wrap:wrap;gap:4px}
.tr{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #141920;
  font-size:12px}
.acts{display:flex;gap:6px;margin:12px 0}
.acts button{border:1px solid var(--line);border-radius:3px;padding:6px 10px;color:var(--dim)}
.acts button:hover{color:var(--tx);border-color:#2E3A47}
.acts button.pri{background:#16303A;border-color:#27596B;color:#9FE2F2}
textarea{width:100%;min-height:92px;background:var(--panel2);border:1px solid var(--line);
  border-radius:3px;color:var(--tx);padding:8px;font:inherit;resize:vertical}
#chat{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto;margin-bottom:8px}
#chat:empty{display:none}
.cm{font-size:12px;line-height:1.5;padding:6px 8px;border:1px solid var(--line);border-radius:3px;
  background:var(--panel2);white-space:pre-wrap;word-break:break-word}
.cm.u{border-color:#27596B;background:#12232B;color:#9FE2F2}
.cm.err{color:var(--warn)}
#chatf{display:flex;gap:6px;margin:0 0 4px}
#chatf input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:3px;
  color:var(--tx);padding:6px 9px;font:inherit;min-width:0}
#chatf input::placeholder{color:var(--faint)}
#chatf button{border:1px solid #27596B;border-radius:3px;padding:6px 10px;color:#9FE2F2;background:#16303A}
.empty{color:var(--faint);padding:40px 14px;text-align:center}
#list[hidden],#graphwrap[hidden]{display:none}
#graphwrap{position:relative;overflow:hidden;min-height:0;background:var(--bg)}
#gcanvas{display:block;width:100%;height:100%;cursor:default}
#glegend{position:absolute;left:10px;bottom:8px;color:var(--faint);font-size:10.5px;
  pointer-events:none;max-width:90%}
#gmode{position:absolute;left:10px;top:8px;display:flex;gap:6px;align-items:center;
  font-size:11px;z-index:4}
#gmode .chip{background:rgba(17,21,27,.85)}
#gprog{font-size:10.5px}
.gl-c{color:var(--acc)}.gl-t{color:var(--warn)}.gl-r{color:var(--dim)}
#gtip{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:3px;
  padding:7px 9px;font-size:11.5px;pointer-events:none;z-index:5;max-width:230px}
#gtip b{font-size:12.5px}
@media(max-width:980px){main.detail #graphwrap{display:none}}
footer{flex:0 0 auto;border-top:1px solid var(--line);background:var(--panel);
  padding:6px 14px;color:var(--faint);font-size:11px;display:flex;gap:16px}
kbd{border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--dim)}
@media(max-width:700px){
  .top{flex-wrap:wrap;gap:9px;padding:9px 12px}
  #src{display:none}
  input[type=search]{width:100%;order:9}
  .filters{padding:6px 12px;gap:5px}
  .chip{padding:3px 9px;font-size:11px}
  footer span:not(#foot):not(.grow){display:none}
  #detail{position:fixed;inset:0;z-index:20;border-left:0}
  main.detail #detail{display:block}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">launch<i>brain</i></div>
    <div class="meta"><b id="cnt">loading</b></div>
    <div class="grow"></div>
    <div class="meta" id="src"></div>
    <input type="search" id="q" placeholder="filter symbol, name, creator" autocomplete="off">
  </div>
  <div class="tabs">
    <button data-tab="curve" class="on">Launches<b id="t1"></b></button>
    <button data-tab="cca">Auctions<b id="t2"></b></button>
    <button data-tab="watch">Watchlist<b id="t3"></b></button>
    <button data-tab="graph">Graph<b id="t4"></b></button>
  </div>
  <div class="filters" id="filters">
    <button class="chip on" data-f="nospam">hide spam</button>
    <button class="chip" data-f="xok">verified X</button>
    <button class="chip" data-f="near">near graduation</button>
    <button class="chip" data-f="live">moving 1h</button>
    <button class="chip" data-f="fresh">new to us</button>
    <button class="chip" id="pend"></button>
    <span class="meta" id="shown"></span>
  </div>
</header>

<script src="data/launches.js" onerror="window.LB_NOJS=1"></script>
<script src="data/auctions.js" onerror="window.LB_NOJS=1"></script>

<main id="main">
  <div id="list"><div class="empty">loading data…</div></div>
  <div id="graphwrap" hidden>
    <canvas id="gcanvas"></canvas>
    <div id="gmode">
      <button data-gm="traders" class="chip on">traders</button>
      <button data-gm="venues" class="chip">venues</button>
      <span id="gprog" class="dim"></span>
    </div>
    <div id="glegend"></div>
    <div id="gtip" hidden></div>
  </div>
  <div id="detail"><div class="empty">select a token</div></div>
</main>

<footer>
  <span><kbd>/</kbd> search</span><span><kbd>j</kbd><kbd>k</kbd> move</span>
  <span><kbd>w</kbd> watch</span><span><kbd>e</kbd> export vault notes</span>
  <span class="grow"></span>
  <span id="foot"></span>
</footer>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// some sources ship names pre-escaped ("S&amp;P"); decode before storing
const unesc = s => s==null ? s : String(s).replace(/&(amp|lt|gt|quot|#39|#x27|nbsp);/g,
  m => ({'&amp;':'&','&lt;':'<','&gt;':'>','&quot;':'"','&#39;':"'",'&#x27;':"'",'&nbsp;':' '}[m]));
const fmtUsd = v => v >= 1e9 ? '$'+(v/1e9).toFixed(2)+'b' : v >= 1e6 ? '$'+(v/1e6).toFixed(2)+'m'
  : v >= 1e3 ? '$'+(v/1e3).toFixed(1)+'k' : '$'+(v||0).toFixed(0);
const fmtPx = v => v >= 1 ? '$'+v.toFixed(4) : '$'+(v||0).toPrecision(3);
const pct = v => (v>0?'+':'')+(v||0).toFixed(1)+'%';
const cls = v => v>0?'up':v<0?'down':'dim';
// dash when a source did not give us the number, per the rules
const dUsd = v => v==null ? '—' : fmtUsd(v);
const dPx = v => v==null || v===0 ? '—' : fmtPx(v);
const dPct = v => v==null ? '—' : pct(v);
const ago = t => { const s=(Date.now()-new Date(t))/1000;
  if(s<90) return Math.max(0,Math.round(s))+'s';
  if(s<3600) return Math.round(s/60)+'m'; if(s<86400) return (s/3600).toFixed(1)+'h';
  return Math.round(s/86400)+'d'; };
const agoU = ts => ago(new Date(ts*1000));
const nowS = () => Math.floor(Date.now()/1000);
const num = v => v==null ? undefined : (isFinite(+v) ? +v : undefined);

/* ---------- state ---------- */
// T is the working truth: one record per curve token, keyed by lowercase address,
// seeded from the committed snapshot and then live-merged in the browser.
const T = new Map();
let CCA = [], META = null;
let tab='curve', sel=null, sort={k:'vol24',d:-1}, filters=new Set(['nospam']), term='';
const SESSION = nowS();
const NEWSEEN = new Set();       // addrs first seen live, this session
const ENRICH = [];               // addrs queued for a one-off dexscreener lookup
const ENRICHED = new Set();
const DIRTY = new Map();         // addr -> price direction since last paint
const TOUCHED = new Set();       // addrs with unsaved local history
// storage can be absent or full (private windows, file://); the page must still run
const lsGet = (k,fb) => { try{ return JSON.parse(localStorage.getItem(k)||fb); }catch(e){ return JSON.parse(fb); } };
const lsSet = (k,v) => { try{ localStorage.setItem(k,v); }catch(e){} };
const WATCH = new Set(lsGet('lb.watch','[]').map(a=>String(a).toLowerCase()));
const NOTES = (()=>{ const n=lsGet('lb.notes','{}'), o={};
  for(const k in n) o[k.toLowerCase()]=n[k]; return o; })();
const saveW = () => lsSet('lb.watch', JSON.stringify([...WATCH]));
const saveN = () => lsSet('lb.notes', JSON.stringify(NOTES));
const HIST_CAP = 288;            // 24h at one snapshot per 5 min

/* ---------- baseline + local persistence ---------- */
async function loadBaseline(){
  let a = window.LB_LAUNCHES, b = window.LB_AUCTIONS;
  if(!a || !b){
    try{
      [a,b] = await Promise.all([
        fetch('data/launches.json').then(r=>r.json()),
        fetch('data/auctions.json').then(r=>r.json())]);
    }catch(e){ /* no baseline; live engine still runs */ }
  }
  if(a && a.launches){ META = a.meta;
    for(const t of a.launches){                 // old snapshots carry checksummed addrs
      t._base = 1; t.addr = (t.addr||'').toLowerCase();
      t.sym = unesc(t.sym); t.name = unesc(t.name);
      T.set(t.addr, t);
    } }
  if(b && b.auctions){ CCA = b.auctions;
    for(const t of CCA){ t.addr = (t.addr||'').toLowerCase(); t.sym = unesc(t.sym); t.name = unesc(t.name); } }
}

const DKEY = 'lb.live.v1';
function unionHist(a, b){
  const m = new Map();
  for(const h of a||[]) m.set(h[0], h);
  for(const h of b||[]) m.set(h[0], h);
  return [...m.values()].sort((x,y)=>x[0]-y[0]).slice(-HIST_CAP);
}
function loadDelta(){
  const d = lsGet(DKEY,'null');
  if(!d || !d.toks) return;
  for(let [a,p] of Object.entries(d.toks)){
    a = a.toLowerCase(); if(p && p.addr) p.addr = p.addr.toLowerCase();
    const t = T.get(a);
    if(!t){ if(p.sym !== undefined) T.set(a, p); continue; }  // full live-found record
    t.hist = unionHist(t.hist, p.hist);
    if(p.first_seen) t.first_seen = Math.min(t.first_seen||p.first_seen, p.first_seen);
    t.last_seen = Math.max(t.last_seen||0, p.last_seen||0);
  }
}
function stripped(t){
  const c = {...t};
  for(const k in c) if(k[0]==='_') delete c[k];   // transient: chart cache, flags
  c.series = []; c.trades = [];
  return c;
}
function saveDelta(){
  const d = lsGet(DKEY,'null') || {toks:{}};
  if(!d.toks) d.toks = {};
  for(const a of TOUCHED){
    const t = T.get(a); if(!t) continue;
    d.toks[a] = t._base
      ? {hist:t.hist||[], first_seen:t.first_seen, last_seen:t.last_seen}
      : stripped(t);
  }
  d.saved = nowS();
  let s = JSON.stringify(d);
  if(s.length > 3500000){
    const es = Object.entries(d.toks).sort((x,y)=>(x[1].last_seen||0)-(y[1].last_seen||0));
    while(s.length > 3000000 && es.length){ delete d.toks[es.shift()[0]]; s = JSON.stringify(d); }
  }
  try{ localStorage.setItem(DKEY, s); TOUCHED.clear(); }catch(e){ /* quota; keep going, memory still works */ }
}
setInterval(()=>{ if(TOUCHED.size) saveDelta(); }, 10000);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && TOUCHED.size) saveDelta(); });

/* ---------- live engine ----------
   Polls the two CORS-open aggregators on a rolling schedule and merges into T.
   pools.trade refuses cross-origin requests (403 when an Origin header is sent,
   verified Sep 2026), so holders, graduation and safety stay snapshot-only and
   are refreshed by scripts/fetch.py via the committed baseline.
   One request in flight at a time, per-feed adaptive gap: doubled on 429,
   decayed back toward the floor on success. A later push feed (SSE) only needs
   to call upsert() with the same patches; nothing below rows() knows about polling. */
const FEEDS = {
  gecko: {label:'gecko', min:2200, gap:2200, at:0, fails:0, st:'idle'},
  ds:    {label:'dexscreener', min:1200, gap:1200, at:0, fails:0, st:'idle'},
  scout: {label:'blockscout', min:1500, gap:1500, at:0, fails:0, st:'idle'},
};
let inflight = false, watchIdx = 0, pageIdx = 0;
const PAGE_DEPTH = 10;             // gecko's free tier answers 401 past page 10
const GT = 'https://api.geckoterminal.com/api/v2/networks/robinhood/';
const JOBS = [
  {id:'new',   src:'gecko', every:15,  last:0, run:()=>gtPools('new_pools?include=base_token,dex')},
  // right after new-pool detection: the trader map wants its data fast
  {id:'trades',src:'gecko', every:2,   last:0, can:()=>!!tradeNeed(), run:tradesStep},
  {id:'sel',   src:'ds',    every:12,  last:0, can:()=>!!(sel && T.has(sel)), run:()=>dsToken(sel)},
  {id:'chart', src:'gecko', every:4,   last:0, can:()=>!!chartNeed(), run:chartStep},
  {id:'watch', src:'ds',    every:18,  last:0, can:()=>WATCH.size>0, run:dsWatchNext},
  {id:'trend', src:'gecko', every:50,  last:0, run:()=>gtPools('trending_pools?include=base_token,dex')},
  {id:'top',   src:'gecko', every:30,  last:0, run:()=>{ pageIdx = pageIdx % PAGE_DEPTH + 1;
    return gtPools('pools?include=base_token,dex&page='+pageIdx); }},
  {id:'enrich',src:'ds',    every:8,   last:0, can:()=>ENRICH.length>0, run:()=>dsToken(ENRICH.shift())},
  {id:'census',src:'scout', every:20,  last:0, can:()=>nowS()>censusRest, run:censusStep},
];
async function api(url){
  const r = await fetch(url, {headers:{accept:'application/json'}});
  if(r.status === 429){ const e = new Error('429'); e.throttle = 1; throw e; }
  if(!r.ok) throw new Error('http '+r.status);
  return r.json();
}
function feedOk(f){ f.fails = 0; f.gap = Math.max(f.min, f.gap*0.75); f.st = 'ok'; drawStatus(); }
function feedErr(f, e){
  if(e.throttle){ f.gap = Math.min(f.gap*2, 120000); f.st = 'slow'; }
  else { f.fails++; f.gap = Math.min(Math.max(f.gap,5000)*1.6, 180000); f.st = f.fails>=3?'down':'slow'; }
  drawStatus();
}
async function pump(){
  if(inflight) return;
  // hidden tab: drop to a slow heartbeat on the new-pools feed only, so the
  // session still records launches without spending the user's quota
  const hid = document.hidden;
  const t = Date.now();
  for(const j of JOBS){
    if(hid && j.id !== 'new') continue;
    const f = FEEDS[j.src];
    if(t - j.last < (hid ? Math.max(j.every,60) : j.every)*1000) continue;
    if(t < f.at) continue;
    if(j.can && !j.can()) continue;
    inflight = true; j.last = t; f.at = t + f.gap;
    try{ await j.run(); feedOk(f); }
    catch(e){ feedErr(f, e); }
    finally{ inflight = false; }
    return;                       // one request per tick
  }
}

function upsert(p, src){
  const a = p.addr; if(!a) return;
  let t = T.get(a); const ts = nowS();
  let born = false;
  if(!t){
    t = {addr:a, first_seen:ts, hist:[]};
    T.set(a, t); born = true;
    if(src === 'geckoterminal' && !ENRICHED.has(a)){ ENRICHED.add(a); ENRICH.push(a); }  // image + socials, once
    if(CENSUS_H.has(a)){ t.holders = CENSUS_H.get(a); CENSUS_H.delete(a); }
  }
  // a token can trade in several pools, and the two feeds measure depth
  // differently. only refuse a patch from a genuinely shallow side pool, so a
  // $3k copycat pool cannot move the price of a token with real liquidity
  if(t.pool && p.pool && t.pool !== p.pool
     && (p.liq||0) < (t.liq||0)*0.5 && (p.liq||0) < 50000){
    t.last_seen = ts; TOUCHED.add(a); return;
  }
  const before = t.price;
  const KEEP = {sym:1, name:1, created:1, img:1, x:1, desc:1};  // set once, never flap between sources
  for(const k in p){
    if(p[k] === undefined || p[k] === null) continue;
    if(KEEP[k] && t[k]) continue;
    t[k] = p[k];
  }
  t.last_seen = ts; t.live_at = ts;
  (t.srcs || (t.srcs = {}))[src] = ts;
  const h = t.hist || (t.hist = []);
  const lastH = h[h.length-1];
  if(!lastH || ts - lastH[0] >= 300){
    h.push([ts, +(+t.price||0).toPrecision(6), t.holders||0, Math.round(t.fdv||0)]);
    if(h.length > HIST_CAP) h.splice(0, h.length - HIST_CAP);
  }
  TOUCHED.add(a);
  if(born){ NEWSEEN.add(a); }
  const dir = (t.price||0) > (before||0) ? 1 : (t.price||0) < (before||0) ? -1 : 0;
  if(!DIRTY.has(a) || dir) DIRTY.set(a, dir);
}

async function gtPools(path){
  const d = await api(GT + path);
  const inc = {}; for(const i of d.included||[]) inc[i.id] = i;
  for(const pool of d.data||[]){
    const at = pool.attributes||{}, rel = pool.relationships||{};
    const bid = rel.base_token && rel.base_token.data && rel.base_token.data.id;
    if(!bid) continue;
    const addr = (bid.split('_')[1]||'').toLowerCase();
    if(!addr) continue;
    const ta = (inc[bid]||{}).attributes||{};
    const tx = (at.transactions||{}).h1||{};
    upsert({
      addr, sym: unesc(ta.symbol), name: unesc(ta.name), img: ta.image_url||undefined,
      pool: (at.address||'').toLowerCase(), dex: rel.dex && rel.dex.data && rel.dex.data.id,
      created: at.pool_created_at,
      price: num(at.base_token_price_usd), fdv: num(at.fdv_usd), mcap: num(at.market_cap_usd),
      liq: num(at.reserve_in_usd),
      ch1h: num((at.price_change_percentage||{}).h1),
      ch6h: num((at.price_change_percentage||{}).h6),
      ch24h: num((at.price_change_percentage||{}).h24),
      vol1h: num((at.volume_usd||{}).h1), vol24: num((at.volume_usd||{}).h24),
      buys1h: tx.buys, sells1h: tx.sells, buyers1h: tx.buyers,

}
async function dsToken(a){
  if(!a) return;
  const d = await api('https://api.dexscreener.com/token-pairs/v1/robinhood/'+a);
  const pairs = (Array.isArray(d)?d:(d.pairs||[])).filter(p =>
    p.baseToken && (p.baseToken.address||'').toLowerCase() === a);
  if(!pairs.length) return;
  const best = pairs.reduce((x,y)=>(((y.liquidity||{}).usd||0) > ((x.liquidity||{}).usd||0) ? y : x));
  const info = best.info||{};
  const tw = (info.socials||[]).find(s=>s.type==='twitter');
  upsert({
    addr: a, sym: unesc(best.baseToken.symbol), name: unesc(best.baseToken.name),
    price: num(best.priceUsd),
    ch1h: num((best.priceChange||{}).h1), ch6h: num((best.priceChange||{}).h6),
    ch24h: num((best.priceChange||{}).h24),
    vol1h: num((best.volume||{}).h1),
    vol24: pairs.reduce((s,p)=>s+((p.volume||{}).h24||0), 0),
    liq: num((best.liquidity||{}).usd), fdv: num(best.fdv), mcap: num(best.marketCap),
    pool: (best.pairAddress||'').toLowerCase()||undefined, dex: best.dexId,
    img: info.imageUrl, x: tw && tw.url,
    created: best.pairCreatedAt ? new Date(best.pairCreatedAt).toISOString() : undefined,
  }, 'dexscreener');
}
function dsWatchNext(){

/* ---------- census: the explorer knows every token ----------
   Every pool listing on the free tiers is capped, so a token with real
   holders but modest current volume can be invisible on all of them at once.
   Blockscout's census (sorted by market cap) names them; the enrich queue
   then prices them via DexScreener. Also the only holder count for tokens
   the launchpad feed does not cover. One page per fire, a full pass roughly
   every ten minutes. */
const BS = 'https://robinhoodchain.blockscout.com/api/v2';
const CENSUS_PAGES = 8;
const CENSUS_SORT = '?type=ERC-20&sort=holders_count&order=desc';
let censusPage = 0, censusQS = CENSUS_SORT, censusRest = 0;
const CENSUS_H = new Map();          // holders for rows that do not exist yet
async function censusStep(){
  const d = await api(BS+'/tokens'+censusQS);
  const ts = nowS();
  for(const i of (d.items||[])){
    const a = (i.address_hash||i.address||'').toLowerCase();
    if(!a.startsWith('0x')) continue;
    const holders = Math.round(num(i.holders_count ?? i.holders)||0);
    const t = T.get(a);
    if(t){
      // blockscout is authoritative on-chain; only the launchpad's own richer
      // feed keeps its number
      if(holders && t.launchpad!=='pools.trade' && holders!==t.holders){
        t.holders = holders; TOUCHED.add(a);
        if(!DIRTY.has(a)) DIRTY.set(a, 0);
      }
      (t.srcs || (t.srcs = {})).blockscout = ts;
    } else if(!ENRICHED.has(a)){
      ENRICHED.add(a); ENRICH.push(a);
      if(holders) CENSUS_H.set(a, holders);
    }
  }
  const np = d.next_page_params;
  censusPage++;
  if(np && censusPage < CENSUS_PAGES){
    censusQS = CENSUS_SORT+'&'+new URLSearchParams(np).toString();
  } else {
    censusPage = 0; censusQS = CENSUS_SORT;
    censusRest = nowS() + 600;
  }
}

/* ---------- charts: real hourly candles for the open token ----------
   GeckoTerminal serves OHLCV per pool, including uniswap v4 pool ids. The
   tracked pool id is tried first; when it is not a GT pool (pools.trade ids
   sometimes differ) the token's pool list resolves the deepest one. */
function chartNeed(){
  if(sel){
    const t = T.get(sel);
    if(t && !('clearing' in t)
       && !(t._ohlcv && nowS() - t._ohlcv_at < 300)
       && !(t._chart_err && nowS() - t._chart_err < 180)) return t;
  }
  // the graph warms candles for its nodes so correlation links can form
  // (in traders mode the gecko budget goes to the trades feed instead)
  if(tab === 'graph' && GRAPH.mode !== 'traders' && !document.hidden){
    for(const n of GRAPH.nodes){
      const t = T.get(n.addr);
      if(t && !('clearing' in t)
         && !(t._ohlcv && nowS() - t._ohlcv_at < 3600)
         && !(t._chart_err && nowS() - t._chart_err < 600)) return t;
    }
  }
  return null;
}
async function chartStep(){
  const t = chartNeed(); if(!t) return;
  const cand = t.gt_pool || t.pool;
  if(!t._pool_ok && !/^0x[0-9a-f]{40,66}$/.test(cand||'')){ await chartResolve(t); return; }
  try{
    const d = await api(GT+'pools/'+(t.gt_pool||t.pool)+'/ohlcv/hour?aggregate=1&limit=72');
    const list = (((d||{}).data||{}).attributes||{}).ohlcv_list || [];
    if(list.length >= 2){
      t._ohlcv = list.slice().reverse().map(r=>+r[4]);     // closes, oldest first
      t._ohlcv_at = nowS(); t._pool_ok = 1;
      if(sel === t.addr) updateDetail(t);
    } else if(!t._pool_ok) await chartResolve(t);
    else t._chart_err = nowS();
  }catch(e){
    if(e.throttle) throw e;                                 // feed-level backoff
    if(!t._pool_ok) await chartResolve(t);
    else t._chart_err = nowS();
  }
}
async function chartResolve(t){
  try{
    const d = await api(GT+'tokens/'+t.addr+'/pools');
    const pools = (d && d.data) || [];
    if(!pools.length){ t._chart_err = nowS(); return; }
    const best = pools.reduce((x,y)=>
      num(y.attributes.reserve_in_usd)>num(x.attributes.reserve_in_usd)?y:x);
    t.gt_pool = (best.attributes.address||'').toLowerCase();
    t._pool_ok = 1;
  }catch(e){ if(e.throttle) throw e; t._chart_err = nowS(); }
}

let tbodyEl = null, rowMap = new Map(), lastOrder = [], orderStale = false, pending = 0,
    lastReorder = 0;
function cellsFor(){ return tab==='cca' ? CELLS.cca : CELLS.curve; }

function makeRow(x){
  const tr = document.createElement('tr');
  tr.dataset.a = x.addr;
  if(sel===x.addr) tr.className = 'sel';
  const cells = cellsFor();
  for(const c of cells){
    const td = document.createElement('td');
    const html = c[0](x), k = c[1](x)||'';
    td.innerHTML = html; td._h = html;
    td.dataset.k = k; if(k) td.className = k;
    tr.appendChild(td);
  }
  rowMap.set(x.addr, tr);
  return tr;
}
function updateRow(tr, x, dir){
  const cells = cellsFor();
  const tds = tr.children;
  for(let i=0; i<cells.length && i<tds.length; i++){
    const html = cells[i][0](x), kl = cells[i][1](x)||'';
    const td = tds[i];
    if(td._h !== html || td.dataset.k !== kl){
      td.innerHTML = html; td._h = html; td.dataset.k = kl;
      const flash = i===3 && dir ? (dir>0?'flu':'fld') : 'fl';
      td.className = kl ? kl+' '+flash : flash;
      td.addEventListener('animationend', ()=>{ td.className = td.dataset.k||''; }, {once:true});
    }
  }
}
function buildTable(r){
  const cols = tab==='cca' ? COLS.cca : COLS.curve;
  const list = $('#list');
  rowMap.clear();
  const table = document.createElement('table');
  table.innerHTML = '<thead><tr>' + cols.map(c=>
      `<th data-k="${c[0]}" class="${sort.k===c[0]?'s':''}">${c[1]}${sort.k===c[0]?(sort.d<0?' ↓':' ↑'):''}</th>`).join('')
    + '<th></th></tr></thead>';
  tbodyEl = document.createElement('tbody');
  for(const x of r) tbodyEl.appendChild(makeRow(x));
  table.appendChild(tbodyEl);
  list.innerHTML = ''; list.appendChild(table);
  table.querySelector('thead').onclick = e=>{
    const th = e.target.closest('th'); if(!th || !th.dataset.k) return;
    const k = th.dataset.k;
    sort = sort.k===k ? {k, d:-sort.d} : {k, d:-1};
    render();
  };
  tbodyEl.onclick = e=>{
    const tr = e.target.closest('tr'); if(!tr) return;
    if(e.target.classList.contains('star')){ toggleWatch(tr.dataset.a); return; }
    select(tr.dataset.a);
  };
}
function reorder(r){
  const want = new Set(r.map(x=>x.addr));
  for(const [a,tr] of rowMap){ if(!want.has(a)){ tr.remove(); rowMap.delete(a); } }
  for(const x of r){
    const tr = rowMap.get(x.addr) || makeRow(x);
    tbodyEl.appendChild(tr);        // append moves existing nodes; order becomes r's order
  }
  lastOrder = r.map(x=>x.addr);
  orderStale = false; pending = 0; lastReorder = Date.now(); drawPending();
}
function drawPending(){
  const b = $('#pend');
  if(pending>0){ b.style.display=''; b.textContent = pending+' new — show'; }
  else b.style.display = 'none';
}
let structDirty = true;
function render(){ structDirty = true; paint(); }
function paint(){
  const g = tab==='graph';
  $('#graphwrap').hidden = !g;
  $('#list').hidden = g;
  if(g){
    $('#shown').textContent = GRAPH.nodes.length+' nodes · '+GRAPH.edges.length+' links';
    gStart();
    return;
  }
  const r = rows();
  $('#shown').textContent = r.length+' shown';
  if(!r.length && structDirty){
    $('#list').innerHTML = `<div class="empty">${tab==='watch'
      ? 'watchlist is empty. press w on a token'
      : T.size===0 && tab==='curve'
        ? 'no snapshot file and nothing live yet — leave the page open, the feeds fill it in'
        : 'nothing matches these filters'}</div>`;
    tbodyEl = null; rowMap.clear(); structDirty = false; lastOrder = [];
    return;
  }
  if(structDirty || !tbodyEl){
    buildTable(r); structDirty = false;
    lastOrder = r.map(x=>x.addr); pending = 0; drawPending();
    return;
  }
  // live path: touch only changed rows, never rebuild
  for(const [a, dir] of DIRTY){
    const tr = rowMap.get(a); const x = T.get(a);
    if(tr && x && tab!=='cca') updateRow(tr, x, dir);
  }
  const order = r.map(x=>x.addr);
  const changed = order.length !== lastOrder.length || order.some((a,i)=>a!==lastOrder[i]);
  if(changed){
    const atTop = $('#list').scrollTop < 8;
    // hold sort order unless the user sits at the top, and even then at most
    // every few seconds so the table doesn't churn under the cursor
    if(atTop && Date.now() - lastReorder > 4000) reorder(r);
    else { orderStale = true; pending = r.filter(x=>!rowMap.has(x.addr)).length; drawPending(); }
  }
}

/* ---------- detail panel ---------- */
function find(a){ return T.get(a) || CCA.find(x=>x.addr===a); }

/* ---------- graph: the risk topology of the top 100 ----------
   The table says what moves; the graph says who is connected to whom.
   Edges the data can actually prove: two tokens deployed by the same
   creator wallet, two tokens sharing recent trader wallets, and two
   tokens whose price series move together. Hand-rolled force layout on
   a canvas — no library, per the one-file rule. */
const GRAPH = {nodes:[], edges:[], raf:0, frame:0, hover:null,
  view:{x:0,y:0,k:1}, drag:null, pan:null, mode:'traders'};
/* trader layer: per-pool trades from geckoterminal, aggregated per wallet.
   "pnl" is an honest estimate over the visible 24h trade window only:
   sells minus buys in usd, plus the net token position marked at the
   current price. It knows nothing about older cost basis and says so. */
const TRADERS = new Map();
const TR_TOKENS = 120;
function tradeNeed(){
  if(tab!=='graph' || GRAPH.mode!=='traders' || document.hidden) return null;
  for(const t of topTokens(TR_TOKENS)){
    if('clearing' in t) continue;
    const pool = t.gt_pool || t.pool;
    if(!pool || !/^0x[0-9a-f]{40,66}$/.test(pool)) continue;
    if(t._tr_at && nowS()-t._tr_at < 600) continue;
    if(t._tr_err && nowS()-t._tr_err < 900) continue;
    return t;
  }
  return null;
}
async function tradesStep(){
  const t = tradeNeed(); if(!t) return;
  try{
    const d = await api(GT+'pools/'+(t.gt_pool||t.pool)+'/trades');
    const per = new Map();
    for(const row of (d.data||[])){
      const a = row.attributes||{};
      const w = (a.tx_from_address||'').toLowerCase();
      if(!w) continue;
      const usd = num(a.volume_in_usd)||0;
      const buy = a.kind === 'buy';
      const amt = num(buy ? a.to_token_amount : a.from_token_amount)||0;
      let p = per.get(w);
      if(!p){ p = {b:0,s:0,ba:0,sa:0,n:0}; per.set(w,p); }
      if(buy){ p.b += usd; p.ba += amt; } else { p.s += usd; p.sa += amt; }
      p.n++;
    }
    t._traders = per; t._tr_at = nowS();
    rebuildTraders();
  }catch(e){
    if(e.throttle) throw e;
    t._tr_err = nowS();
  }
}
function rebuildTraders(){
  TRADERS.clear();
  for(const t of topTokens(TR_TOKENS)){
    if(!t._traders) continue;
    for(const [w,p] of t._traders){
      let tr = TRADERS.get(w);
      if(!tr){ tr = {w, vol:0, pnl:0, buys:0, sells:0, toks:new Map()}; TRADERS.set(w,tr); }
      const pnl = p.s - p.b + (p.ba - p.sa) * (t.price||0);
      tr.vol += p.b + p.s; tr.buys += p.b; tr.sells += p.s; tr.pnl += pnl;
      tr.toks.set(t.addr, {usd:p.b+p.s, b:p.b, s:p.s, pnl});
    }
  }
}
const gDPR = window.devicePixelRatio || 1;
function gWorld(mx,my){ const v=GRAPH.view; return [(mx-v.x)/v.k, (my-v.y)/v.k]; }
function gVenue(t){
  if(t.launchpad==='pools.trade' || t.grad!=null) return 'pools.trade';
  const d = (t.dex||'').replace(/-robinhood$/,'').replace(/-dex$/,'');
  return d || 'unknown venue';
}

function topTokens(n){
  // a blend: the chain's movers plus the launchpad's movers. The launchpad
  // half is where creator and trader links exist at all.
  const all = [...T.values()].filter(t=>!t.spam && !('clearing' in t) && t.sym)
    .sort((a,b)=>Math.max(b.vol24||0,b.liq||0)-Math.max(a.vol24||0,a.liq||0));
  const out = all.slice(0, Math.round(n*0.6));
  const have = new Set(out.map(t=>t.addr));
  for(const t of all){
    if(out.length >= n) break;
    if(t.grad != null && !have.has(t.addr)){ have.add(t.addr); out.push(t); }
  }
  for(const t of all){                        // pad if few launchpad tokens
    if(out.length >= n) break;
    if(!have.has(t.addr)){ have.add(t.addr); out.push(t); }
  }
  return out;
}
function gRets(s){
  if(!s || s.length<20) return null;
  const r=[]; for(let i=1;i<s.length;i++){
    if(s[i-1]>0 && s[i]>0) r.push(Math.log(s[i]/s[i-1])); }
  return r.length>=15 ? r : null;
}
function gPearson(a,b){
  const n=Math.min(a.length,b.length); if(n<15) return 0;
  let sa=0,sb=0; for(let i=0;i<n;i++){sa+=a[i];sb+=b[i];}
  const ma=sa/n, mb=sb/n; let cov=0,va=0,vb=0;
  for(let i=0;i<n;i++){const x=a[i]-ma,y=b[i]-mb;cov+=x*y;va+=x*x;vb+=y*y;}
  return va&&vb ? cov/Math.sqrt(va*vb) : 0;
}
function buildGraph(){
  const wrap=$('#graphwrap'), c=$('#gcanvas');
  const W=wrap.clientWidth||800, H=wrap.clientHeight||500;
  c.width=W*gDPR; c.height=H*gDPR;
  if(GRAPH.W && (GRAPH.W!==W || GRAPH.H!==H)){   // canvas resized: keep layout
    const sx=W/GRAPH.W, sy=H/GRAPH.H;
    for(const n of GRAPH.nodes){ n.x*=sx; n.y*=sy; }
  }
  GRAPH.W=W; GRAPH.H=H;
  const toks=topTokens(GRAPH.mode==='traders'?TR_TOKENS:100);
  const old=new Map(GRAPH.nodes.map(n=>[n.addr,n]));
  GRAPH.nodes=toks.map(t=>old.get(t.addr)||{
    addr:t.addr,
    x:W/2+(Math.random()-.5)*W*.7, y:H/2+(Math.random()-.5)*H*.7, vx:0, vy:0});
  if(GRAPH.mode==='traders'){
    // top wallets of the day, sized by traded volume, coloured by window pnl
    const top=[...TRADERS.values()].sort((a,b)=>b.vol-a.vol).slice(0,100);
    for(const tr of top){
      const a='tr:'+tr.w, o=old.get(a);
      GRAPH.nodes.push(o||{addr:a, trader:1, w:tr.w,
        x:W/2+(Math.random()-.5)*W*.5, y:H/2+(Math.random()-.5)*H*.5, vx:0, vy:0});
    }
  } else {
    // venue hubs: every token hangs off its exchange, so the map is connected
    // even before creator, trader and correlation links show up
    const venues={};
    for(const t of toks){ const v=gVenue(t); venues[v]=(venues[v]||0)+1; }
    for(const v in venues){
      const a='hub:'+v;
      const o=old.get(a);
      GRAPH.nodes.push(o||{addr:a, hub:1, label:v, n:venues[v],
        x:W/2+(Math.random()-.5)*W*.5, y:H/2+(Math.random()-.5)*H*.5, vx:0, vy:0});
      if(o){ o.label=v; o.n=venues[v]; }
    }
  }
  const idx=new Map(GRAPH.nodes.map((n,i)=>[n.addr,i]));
  const edges=[], pair=new Set();
  const push=(a,b,k,w)=>{ const key=a<b?a+b:b+a;
    if(a!==b && !pair.has(key+k)){ pair.add(key+k); edges.push({a:idx.get(a),b:idx.get(b),k,w:w||1}); } };
  const byC={};
  for(const t of toks){ const cr=t.creator||t.chandle;
    if(cr)(byC[cr]=byC[cr]||[]).push(t.addr); }
  for(const cr in byC){ const g=byC[cr];
    for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++) push(g[i],g[j],'creator'); }
  const tr=toks.map(t=>({a:t.addr,s:new Set((t.trades||[]).map(x=>x.trader).filter(Boolean))}));
  for(let i=0;i<tr.length;i++)for(let j=i+1;j<tr.length;j++){
    if(!tr[i].s.size||!tr[j].s.size) continue;
    let n=0; for(const v of tr[i].s) if(tr[j].s.has(v)) n++;
    if(n) push(tr[i].a,tr[j].a,'trader',n);
  }
  const rs=toks.map(t=>({a:t.addr,r:gRets(t._ohlcv&&t._ohlcv.length>19?t._ohlcv:t.series)}));
  const corr=[];
  for(let i=0;i<rs.length;i++)for(let j=i+1;j<rs.length;j++){
    if(!rs[i].r||!rs[j].r) continue;
    const r=gPearson(rs[i].r,rs[j].r);
    if(r>=.75) corr.push([rs[i].a,rs[j].a,r]);
  }
  corr.sort((x,y)=>y[2]-x[2]).slice(0,120).forEach(([a,b,r])=>push(a,b,'corr',r));
  if(GRAPH.mode==='traders'){
    const flows=[];
    for(const n of GRAPH.nodes){
      if(!n.trader) continue;
      const tr=TRADERS.get(n.w); if(!tr) continue;
      for(const [ta,st] of tr.toks){
        if(idx.has(ta) && st.usd>=20) flows.push([n.addr,ta,st]);
      }
    }
    flows.sort((x,y)=>y[2].usd-x[2].usd).slice(0,500)
      .forEach(([a,b,st])=>{ const key=a+b;
        edges.push({a:idx.get(a),b:idx.get(b),k:'flow',w:st.usd,dir:st.b>=st.s?1:-1}); });
  } else {
    for(const t of toks) push(t.addr,'hub:'+gVenue(t),'venue');
  }
  GRAPH.edges=edges;
  if($('#t4')) $('#t4').textContent=GRAPH.nodes.length;
}
function gRadius(t,vmax){
  return 6+22*Math.sqrt(Math.max(t.vol24||0,t.liq||0)/(vmax||1));
}
function gRadii(){
  const toks=GRAPH.nodes.map(n=>(n.hub||n.trader)?null:(T.get(n.addr)||{}));
  const vmax=Math.max(1,...toks.map(t=>t?Math.max(t.vol24||0,t.liq||0):0));
  const tvmax=Math.max(1,...[...TRADERS.values()].map(t=>t.vol));
  return {toks, R: GRAPH.nodes.map((n,i)=>
    n.hub?11 : n.trader?8+15*Math.sqrt((TRADERS.get(n.w)||{vol:0}).vol/tvmax)
    : gRadius(toks[i],vmax))};
}
function gStep(){
  if(tab!=='graph'||document.hidden){ GRAPH.raf=0; return; }
  if(++GRAPH.frame%600===0) buildGraph();           // refresh links every ~10s
  if(GRAPH.frame%120===0) gProgress();
  const c=$('#gcanvas'), W=c.width/gDPR, H=c.height/gDPR;
  const N=GRAPH.nodes, {toks,R}=gRadii();
  for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){
    const a=N[i],b=N[j]; let dx=b.x-a.x, dy=b.y-a.y;
    const d2=dx*dx+dy*dy||1, d=Math.sqrt(d2), min=R[i]+R[j]+6;
    let f=Math.min(1400/d2,.7);                       // repulsion
    if(d<min) f+=(min-d)*.02;                         // no overlap
    dx/=d; dy/=d;
    a.vx-=dx*f; a.vy-=dy*f; b.vx+=dx*f; b.vy+=dy*f;
  }
  for(const e of GRAPH.edges){
    const a=N[e.a],b=N[e.b]; if(!a||!b) continue;
    let dx=b.x-a.x, dy=b.y-a.y;
    const d=Math.sqrt(dx*dx+dy*dy)||1;
    const rest=R[e.a]+R[e.b]+(e.k==='creator'?36:e.k==='venue'?70:e.k==='flow'?55:64);
    const f=(d-rest)*(e.k==='creator'?.004:e.k==='venue'?.0015:e.k==='flow'?.0025:.002);
    dx/=d; dy/=d;
    a.vx+=dx*f; a.vy+=dy*f; b.vx-=dx*f; b.vy-=dy*f;
  }
  for(let i=0;i<N.length;i++){
    const n=N[i];
    if(n.pin){ n.vx=0; n.vy=0; continue; }            // held by the user
    n.vx+=(W/2-n.x)*.0005+(Math.random()-.5)*.06;    // gravity + idle wobble
    n.vy+=(H/2-n.y)*.0005+(Math.random()-.5)*.06;
    n.vx*=.92; n.vy*=.92;
    const sp=Math.hypot(n.vx,n.vy);
    if(sp>2.5){ n.vx*=2.5/sp; n.vy*=2.5/sp; }
    n.x+=n.vx; n.y+=n.vy;
  }
  gDraw(W,H,R,toks);
  GRAPH.raf=requestAnimationFrame(gStep);
}
const IMGS = new Map();          // token logo cache for the bubbles
function gImg(t){
  if(!t.img) return null;
  let rec = IMGS.get(t.img);
  if(!rec){
    rec = {ok:0, el:new Image()};
    rec.el.crossOrigin = 'anonymous';
    rec.el.onload = ()=>{ rec.ok = 1; };
    rec.el.src = t.img;
    IMGS.set(t.img, rec);
  }
  return rec.ok ? rec.el : null;
}
function gNeighbors(){
  // focus set for hover: the hovered node and everything linked to it
  if(!GRAPH.hover) return null;
  const s = new Set([GRAPH.hover]);
  for(const e of GRAPH.edges){
    const a=GRAPH.nodes[e.a], b=GRAPH.nodes[e.b]; if(!a||!b) continue;
    if(a.addr===GRAPH.hover) s.add(b.addr);
    if(b.addr===GRAPH.hover) s.add(a.addr);
  }
  return s;
}
function gDraw(W,H,R,toks){
  const ctx=$('#gcanvas').getContext('2d');
  const v=GRAPH.view;
  ctx.setTransform(gDPR,0,0,gDPR,0,0);
  ctx.clearRect(0,0,W,H);
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.2,W/2,H/2,Math.max(W,H)*.75);
  vg.addColorStop(0,'#0D1015'); vg.addColorStop(1,'#080A0D');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  ctx.setTransform(gDPR*v.k,0,0,gDPR*v.k,gDPR*v.x,gDPR*v.y);
  const css=getComputedStyle(document.documentElement);
  const CU=css.getPropertyValue('--up').trim(), CD=css.getPropertyValue('--down').trim(),
        CA=css.getPropertyValue('--acc').trim(), CW=css.getPropertyValue('--warn').trim();
  const focus=gNeighbors();
  for(const e of GRAPH.edges){
    const a=GRAPH.nodes[e.a], b=GRAPH.nodes[e.b]; if(!a||!b) continue;
    const inF = focus && (a.addr===GRAPH.hover || b.addr===GRAPH.hover);
    ctx.strokeStyle = e.k==='creator'?CA : e.k==='trader'?CW :
                      e.k==='flow'?(e.dir>=0?CU:CD) :
                      e.k==='venue'?'#26303B' : '#46525F';
    ctx.globalAlpha = focus ? (inF?.9:.05)
      : e.k==='venue'?.5 : e.k==='corr'?.35 : e.k==='flow'?.45 : .55;
    ctx.lineWidth = (e.k==='trader'?Math.min(1+e.w*.5,3)
      : e.k==='flow'?Math.min(.8+Math.log10(1+e.w)*.6,3.4) : 1)/v.k;
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1;
    ctx.beginPath(); ctx.moveTo(a.x,a.y);
    ctx.quadraticCurveTo(mx-dy/d*d*.08, my+dx/d*d*.08, b.x, b.y);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
  for(let i=0;i<GRAPH.nodes.length;i++){
    const n=GRAPH.nodes[i], r=R[i];
    const dimmed = focus && !focus.has(n.addr);
    ctx.globalAlpha = dimmed ? .18 : 1;
    if(n.hub){
      ctx.beginPath(); ctx.arc(n.x,n.y,r,0,7);
      ctx.fillStyle='#141A22'; ctx.fill();
      ctx.lineWidth=1/v.k; ctx.strokeStyle='#3A4552'; ctx.stroke();
      ctx.fillStyle='#7A8794'; ctx.font='10px ui-monospace,monospace';
      ctx.textAlign='center';
      ctx.fillText(n.label.slice(0,16), n.x, n.y-r-5);
      ctx.fillText(String(n.n), n.x, n.y+3);
      continue;
    }
    if(n.trader){
      const tr=TRADERS.get(n.w)||{vol:0,pnl:0};
      const up=tr.pnl>=0;
      ctx.save();
      if(n.addr===GRAPH.hover){ ctx.shadowColor=up?CU:CD; ctx.shadowBlur=18; }
      ctx.beginPath();
      ctx.moveTo(n.x,n.y-r); ctx.lineTo(n.x+r,n.y); ctx.lineTo(n.x,n.y+r); ctx.lineTo(n.x-r,n.y);
      ctx.closePath();
      ctx.fillStyle=up?'#12291C':'#2B1614'; ctx.fill();
      ctx.lineWidth=1.4/v.k; ctx.strokeStyle=up?CU:CD; ctx.stroke();
      ctx.restore();
      if(r*v.k>=8){
        ctx.fillStyle='#9AA6B2'; ctx.font='9.5px ui-monospace,monospace';
        ctx.textAlign='center';
        ctx.fillText(n.w.slice(2,6)+'…'+n.w.slice(-4), n.x, n.y+r+11);
      }
      continue;
    }
    const t=toks[i]||{};
    // in traders mode a token whose trades are not read yet stays faint
    const unread = GRAPH.mode==='traders' && !t._traders;
    if(unread && !dimmed) ctx.globalAlpha=.28;
    const up=(t.ch24h||0)>=0, col=up?CU:CD;
    const hot=n.addr===GRAPH.hover||sel===n.addr||WATCH.has(n.addr);
    ctx.save();
    if(hot && !dimmed){ ctx.shadowColor=col; ctx.shadowBlur=16; }
    const grad=ctx.createRadialGradient(n.x-r*.35,n.y-r*.35,r*.1,n.x,n.y,r);
    grad.addColorStop(0, up?'rgba(95,208,140,.55)':'rgba(224,106,94,.55)');
    grad.addColorStop(1, up?'rgba(95,208,140,.12)':'rgba(224,106,94,.12)');
    ctx.beginPath(); ctx.arc(n.x,n.y,r,0,7);
    ctx.fillStyle=grad; ctx.fill();
    ctx.restore();
    const img=gImg(t);
    if(img && r>=9){
      ctx.save();
      ctx.globalAlpha = dimmed ? .18 : .92;
      ctx.beginPath(); ctx.arc(n.x,n.y,r*.72,0,7); ctx.clip();
      try{ ctx.drawImage(img, n.x-r*.72, n.y-r*.72, r*1.44, r*1.44); }catch(_){}
      ctx.restore();
      ctx.globalAlpha = dimmed ? .18 : 1;
    }
    ctx.beginPath(); ctx.arc(n.x,n.y,r,0,7);
    ctx.lineWidth = (WATCH.has(n.addr)?2:1.2)/v.k;
    ctx.strokeStyle = WATCH.has(n.addr)?CW : sel===n.addr?CA : up?'rgba(95,208,140,.65)':'rgba(224,106,94,.65)';
    ctx.stroke();
    if(r*v.k>=11){
      ctx.fillStyle = dimmed?'#4E5A66':'#C6D0DA';
      ctx.font='10.5px ui-monospace,monospace'; ctx.textAlign='center';
      ctx.fillText((t.sym||'').slice(0,8), n.x, n.y+r+11);
    }
  }
  ctx.globalAlpha=1;
}

function gNodeAt(mx,my){
  const [wx,wy]=gWorld(mx,my);
  const {toks,R}=gRadii();
  for(let i=GRAPH.nodes.length-1;i>=0;i--){
    const n=GRAPH.nodes[i];
    if(Math.hypot(wx-n.x,wy-n.y)<=R[i]+2) return n;

function sparkSeries(x){
  if(x._ohlcv && x._ohlcv.length>1) return x._ohlcv;        // real hourly closes
  if(x.series && x.series.length>1) return x.series;        // pools.trade snapshot
  const hist = (x.hist||[]).map(h=>h[1]).filter(v=>v>0);
  return hist.length>1 ? hist : null;
}
function chartLabel(x){
  if('clearing' in x) return x.series&&x.series.length>1 ? 'chart: pools.trade snapshot' : 'no chart data';
  if(x._ohlcv && x._ohlcv.length>1) return 'chart: last '+x._ohlcv.length+'h hourly · geckoterminal';
  if(x.series && x.series.length>1) return 'chart: price series · pools.trade snapshot';
  if((x.hist||[]).length>1) return 'chart: local snapshots · one per 5 min';
  return x._chart_err ? 'no chart data on any feed for this pool' : 'chart loading from geckoterminal…';
}
function spark(x){
  const series = sparkSeries(x);
  if(!series || series.length<2) return '<div class="spark"></div>';
  const w=340,h=74,p=6, mn=Math.min(...series), mx=Math.max(...series), rg=(mx-mn)||1;
  const pts = series.map((v,i)=>[p+i*(w-2*p)/(series.length-1), h-p-((v-mn)/rg)*(h-2*p)]);
  const d = pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');
  const up = series[series.length-1] >= series[0];
  const col = up ? 'var(--up)' : 'var(--down)';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${d} L${pts[pts.length-1][0].toFixed(1)},${h} L${pts[0][0].toFixed(1)},${h} Z"
      fill="${col}" fill-opacity=".1"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="1.5"/></svg>`;
}

  return parts.length ? 'sources: '+parts.join(' · ') : 'source: local history only';

  ...(AI_RELAY_URL ? {relay: {url: AI_RELAY_URL, model:'', needsKey:false}} : {}),
  // bare: the anonymous tier rejects system role and sampling params
  pollinations: {url:'https://gen.pollinations.ai/v1/chat/completions',
    model:'openai-fast', needsKey:false, bare:true},
  openrouter: {url:'https://openrouter.ai/api/v1/chat/completions',
    model:'deepseek/deepseek-chat-v3-0324:free', needsKey:true},
  groq: {url:'https://api.groq.com/openai/v1/chat/completions',
    model:'llama-3.3-70b-versatile', needsKey:true},
};
let AI = Object.assign({prov: AI_RELAY_URL ? 'relay' : 'pollinations', key:'', model:''},
  lsGet('lb.ai','{}'));
if(!AI_PROVIDERS[AI.prov]) AI.prov = AI_RELAY_URL ? 'relay' : 'pollinations';
const CHAT = {};             // addr -> [{role, content, err}]
let aiBusy = false;
const AI_SYS = `You are the assistant inside LaunchBrain, a terminal tracking token launches on Robinhood Chain (chain id 4663, an Arbitrum Orbit L2). You get one token's live data as JSON.
Rules:
- Answer in the language the user writes in.
- Maximum 1-3 short sentences. No filler, no greetings, no headers, no emoji, no markdown. Prefer concrete numbers from the data.
- Use only the JSON and general market knowledge. A null or missing field is unknown: say so, never invent numbers.
- A risk read covers: liquidity depth vs fdv, 24h volume vs liquidity (turnover), momentum, holder count, spam and safety flags, unverified X account, pool age.
- Never recommend buying or selling, never predict price. Asked "should I buy", give the risk read in two sentences and note this terminal gives no financial advice.`;

function tokenContext(x){
  return JSON.stringify({
    symbol:x.sym, name:x.name, address:x.addr, description:x.desc||null,
    price_usd:x.price??null, change_1h_pct:x.ch1h??null, change_24h_pct:x.ch24h??null,
    volume_24h_usd:x.vol24??null, volume_1h_usd:x.vol1h??null,
    liquidity_usd:x.liq??null, fdv_usd:x.fdv??null, market_cap_usd:x.mcap||null,
    holders:x.holders||null, graduation_pct:x.grad??null,
    buys_1h:x.buys1h??null, sells_1h:x.sells1h??null, buyers_1h:x.buyers1h??null,
    pool_created:x.created||null,
    first_seen_by_terminal:x.first_seen?new Date(x.first_seen*1000).toISOString():null,
    dex:x.dex||null, launchpad:x.launchpad||null,
    spam_flagged:!!x.spam, safety_verdict:x.verdict||'unknown', safety_flags:x.flags||[],
    x_account:x.x||null, x_verified:!!x.xok,
    hourly_closes_recent:x._ohlcv?x._ohlcv.slice(-24):null,
    data_sources:srcLine(x),
  });
}
async function askAI(x){
  const p = AI_PROVIDERS[AI.prov] || AI_PROVIDERS.pollinations;
  const hist = (CHAT[x.addr]||[]).filter(m=>!m.err).slice(-8)
    .map(m=>({role:m.role, content:m.content}));
  let body;
  if(p.bare){
    const convo = hist.map(m=>(m.role==='user'?'User: ':'Assistant: ')+m.content).join('\n');
    body = {model: AI.model||p.model, max_tokens: 300, messages: [{role:'user',
      content: AI_SYS+'\n\nToken data (JSON): '+tokenContext(x)
        +'\n\nConversation:\n'+convo+'\n\nAnswer the last user message.'}]};
  } else {
    body = {model: AI.model||p.model, max_tokens: 300, temperature: 0.3, messages: [
      {role:'system', content: AI_SYS},
      {role:'user', content: 'Token data (JSON): '+tokenContext(x)},
      ...hist]};
  }
  const hdrs = {'Content-Type':'application/json'};
  if(p.needsKey){
    if(!AI.key) throw new Error('nokey');
    hdrs.Authorization = 'Bearer '+AI.key;
  }
  const r = await fetch(p.url, {method:'POST', headers:hdrs, body: JSON.stringify(body)});
  if(!r.ok) throw new Error('http '+r.status);
  const d = await r.json();
  const out = (((d.choices||[])[0]||{}).message||{}).content;
  if(!out) throw new Error('empty reply');
  return out.trim();
}
function renderChat(addr){
  const c = $('#chat'); if(!c || sel!==addr) return;
  c.innerHTML = (CHAT[addr]||[]).map(m=>
    `<div class="cm ${m.role==='user'?'u':''}${m.err?' err':''}">${esc(m.content)}</div>`).join('')
    + (aiBusy ? '<div class="cm dim">thinking…</div>' : '');
  c.scrollTop = c.scrollHeight;
}
async function sendChat(addr){
  const inp = $('#chati'); if(!inp || aiBusy) return;
  const q = inp.value.trim(); if(!q) return;
  const x = find(addr); if(!x) return;
  const th = CHAT[addr] || (CHAT[addr]=[]);
  th.push({role:'user', content:q});
  inp.value = '';
  aiBusy = true; renderChat(addr);
  try{
    const ans = await askAI(x);
    th.push({role:'assistant', content: ans});
  }catch(e){
    th.push({role:'assistant', err:1, content:
      e.message==='nokey'
        ? AI.prov+' needs an api key — click the provider name above to set one'
        : AI.prov==='relay'
        ? 'chat backend error ('+e.message+'). likely busy — try again in a minute, or '+
          'click the provider name above to use your own free key instead.'
        : 'provider error ('+e.message+'). the keyless provider currently rejects most '+
          'anonymous requests. reliable free path: create a key at console.groq.com/keys '+
          'or openrouter.ai (both have free tiers), click the provider name above, pick '+
          'groq or openrouter, paste the key. it is stored in this browser only.'});
  }
  aiBusy = false;
  if(th.length>24) th.splice(0, th.length-24);
  renderChat(addr);
}
function configAI(){
  const prov = (prompt('ai provider: '+Object.keys(AI_PROVIDERS).join(' / '), AI.prov)||'').trim().toLowerCase();
  if(AI_PROVIDERS[prov]){
    AI.prov = prov;
    if(AI_PROVIDERS[prov].needsKey){
      const k = prompt('api key for '+prov+' (stored only in this browser, never sent anywhere else)', AI.key||'');
      if(k!==null) AI.key = k.trim();
    }
    lsSet('lb.ai', JSON.stringify(AI));
  }
  if(sel) select(sel);
}

function toggleWatch(a){
  WATCH.has(a) ? WATCH.delete(a) : WATCH.add(a);
  saveW(); drawCounts();
  const tr = rowMap.get(a); const x = T.get(a);
  if(tr && x && tab!=='cca') updateRow(tr, x, 0);
  if(tab==='watch') render();
  if(sel===a){ const b=$('#d_star'); if(b) b.classList.toggle('on', WATCH.has(a)); }
}

created: ${new Date().toISOString().slice(0,10)}
chain: robinhood-chain-4663
address: ${x.addr}
creator: ${x.creator||'unknown'}
launchpad: ${x.grad!=null?'pools.trade':'unknown'}

 ? `- clearing price: ${dPx(x.clearing)}\n- raised: ${dUsd(x.raised)}\n- bidders: ${x.bidders??'—'}`

function dl(name, text){
  const b = new Blob([text], {type:'text/markdown'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; a.click();
  URL.revokeObjectURL(a.href);
}
function exportOne(a){ const x=find(a); if(x) dl(`${x.sym}.md`, md(x)); }
function exportVault(){
  const list = [...WATCH].map(find).filter(Boolean);
  if(!list.length){ alert('watchlist is empty'); return; }
  dl(`robinhood-launches-${new Date().toISOString().slice(0,10)}.md`,
    `---
title: Robinhood Chain launches
type: source
created: ${new Date().toISOString().slice(0,10)}
tags: [onchain, launch]
---

# Robinhood Chain launches, ${new Date().toISOString().slice(0,10)}

${list.length} tokens on the watchlist.

` + list.map(x=>md(x).split('---\n')[2]).join('\n---\n'));
}

/* ---------- events ---------- */
$('#q').oninput = e => {

  // a pasted contract address the table does not know gets looked up live

  if(/^0x[0-9a-f]{40}$/.test(m) && !T.has(m) && !ENRICHED.has(m)){
    ENRICHED.add(m); ENRICH.unshift(m);

};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{

function gLegend(){
  $('#glegend').innerHTML = GRAPH.mode==='traders'
    ? `diamonds: top wallets of the day · green outline: window pnl up, red: down ·
       <span class="gl-r">lines: wallet traded that token, green bought more, red sold more</span> ·

    : `size: volume &amp; depth · colour: 24h move · hollow nodes: venues ·

}
function gProgress(){
  if(GRAPH.mode!=='traders'){ $('#gprog').textContent=''; return; }
  const toks = topTokens(TR_TOKENS).filter(t=>!('clearing' in t));
  const done = toks.filter(t=>t._tr_at).length;
  $('#gprog').textContent = done<toks.length
    ? `reading trades ${done}/${toks.length} pools · ${TRADERS.size} wallets`
    : `${TRADERS.size} wallets · 24h window`;
}
function gTip(e, n){
  const tip = $('#gtip'), rc = $('#gcanvas').getBoundingClientRect();
  if(!n){ tip.hidden = true; return; }
  if(n.trader){
    const tr = TRADERS.get(n.w);
    if(!tr){ tip.hidden = true; return; }
    const top = [...tr.toks.entries()].sort((a,b)=>b[1].usd-a[1].usd).slice(0,4)
      .map(([a,st])=>{ const t=T.get(a)||{};
        return `${esc(t.sym||a.slice(0,8))} ${dUsd(st.usd)} <span class="${st.pnl>=0?'up':'down'}">${st.pnl>=0?'+':''}${dUsd(Math.abs(st.pnl))}</span>`; })
      .join('<br>');
    tip.innerHTML = `<b>${esc(n.w.slice(0,10))}…</b><br>
      <span class="dim">24h vol ${dUsd(tr.vol)} · bought ${dUsd(tr.buys)} · sold ${dUsd(tr.sells)}</span><br>
      window pnl <span class="${tr.pnl>=0?'up':'down'}">${tr.pnl>=0?'+':''}${dUsd(Math.abs(tr.pnl))}</span> <span class="dim">(est., 24h trades only)</span><br>${top}`;
  } else if(n.hub){
    tip.innerHTML = `<b>${esc(n.label)}</b><br><span class="dim">${n.n} of the top 100 trade here</span>`;
  } else {
    const t = T.get(n.addr) || {};
    tip.innerHTML = `<b>${esc(t.sym||'?')}</b> <span class="dim">${esc(t.name||'')}</span><br>
      ${dPx(t.price)} · <span class="${cls(t.ch24h)}">${dPct(t.ch24h)}</span> 24h<br>
      <span class="dim">vol ${dUsd(t.vol24)} · liq ${dUsd(t.liq)}
      ${t.holders?' · '+t.holders+' holders':''}</span>
      ${t.creator?'<br><span class="dim">creator '+esc(String(t.creator).slice(0,10))+'…</span>':''}`;
  }
  tip.hidden = false;
  const wrap = $('#graphwrap');
  tip.style.left = Math.min(e.clientX-rc.left+14, wrap.clientWidth-240)+'px';
  tip.style.top = Math.max(e.clientY-rc.top-10, 4)+'px';
}
const gc = $('#gcanvas');
gc.style.touchAction = 'none';
gc.onpointerdown = e => {
  gc.setPointerCapture(e.pointerId);
  const rc = gc.getBoundingClientRect();
  const n = gNodeAt(e.clientX-rc.left, e.clientY-rc.top);
  if(n){ n.pin = 1; GRAPH.drag = {n, moved:0, lx:e.clientX, ly:e.clientY}; }
  else GRAPH.pan = {lx:e.clientX, ly:e.clientY, moved:0};
  $('#gtip').hidden = true;
};
gc.onpointermove = e => {
  const rc = gc.getBoundingClientRect();
  if(GRAPH.drag){
    const d = GRAPH.drag, [wx,wy] = gWorld(e.clientX-rc.left, e.clientY-rc.top);
    d.n.vx = (wx-d.n.x)*.4; d.n.vy = (wy-d.n.y)*.4;   // fling on release
    d.n.x = wx; d.n.y = wy;
    d.moved += Math.abs(e.clientX-d.lx)+Math.abs(e.clientY-d.ly);
    d.lx = e.clientX; d.ly = e.clientY;
    return;
  }
  if(GRAPH.pan){
    const p = GRAPH.pan;
    GRAPH.view.x += e.clientX-p.lx; GRAPH.view.y += e.clientY-p.ly;
    p.moved += Math.abs(e.clientX-p.lx)+Math.abs(e.clientY-p.ly);
    p.lx = e.clientX; p.ly = e.clientY;
    gc.style.cursor = 'grabbing';
    return;
  }
  const n = gNodeAt(e.clientX-rc.left, e.clientY-rc.top);
  GRAPH.hover = n && n.addr;
  gc.style.cursor = n ? 'pointer' : 'grab';
  gTip(e, n);
};
gc.onpointerup = gc.onpointercancel = e => {
  const rc = gc.getBoundingClientRect();
  if(GRAPH.drag){
    const d = GRAPH.drag; d.n.pin = 0;
    if(d.moved < 5){                                   // a tap is a click
      if(d.n.trader) window.open('https://robinhoodchain.blockscout.com/address/'+d.n.w, '_blank');
      else if(!d.n.hub) select(d.n.addr);
    }
    GRAPH.drag = null;
  } else if(GRAPH.pan){
    GRAPH.pan = null; gc.style.cursor = 'grab';
  }
};
gc.onpointerleave = () => { if(!GRAPH.drag && !GRAPH.pan){ $('#gtip').hidden = true; GRAPH.hover = null; } };
gc.onwheel = e => {
  e.preventDefault();
  const rc = gc.getBoundingClientRect(), v = GRAPH.view;
  const mx = e.clientX-rc.left, my = e.clientY-rc.top;
  const k2 = Math.max(.25, Math.min(4, v.k * Math.exp(-e.deltaY*.0012)));
  v.x = mx - (mx - v.x) * k2 / v.k;
  v.y = my - (my - v.y) * k2 / v.k;
  v.k = k2;
};
$('#filters').onclick = e => {
  const c = e.target.closest('.chip'); if(!c) return;
  if(c.id==='pend'){ const r=rows(); if(tbodyEl) reorder(r); else render(); return; }
  if(!c.dataset.f) return;
  filters.has(c.dataset.f) ? filters.delete(c.dataset.f) : filters.add(c.dataset.f);
  c.classList.toggle('on'); render();
};
$('#list').addEventListener('scroll', ()=>{
  if(orderStale && $('#list').scrollTop < 8 && tbodyEl) reorder(rows());
});
document.addEventListener('keydown', e=>{
  const tag = e.target.tagName;
  if(tag==='TEXTAREA' || tag==='SELECT') return;          // never fire while typing
  if(tag==='INPUT' && e.target !== $('#q')) return;
  if(e.key==='/' && e.target!==$('#q')){ e.preventDefault(); $('#q').focus(); return; }
  if(e.target===$('#q')){ if(e.key==='Escape'){$('#q').value='';term='';render();$('#q').blur();} return; }
  const r = rows(); if(!r.length) return;
  const i = r.findIndex(x=>x.addr===sel);
  if(e.key==='j'){ select(r[Math.min(i+1, r.length-1)>=0?Math.min(i+1,r.length-1):0].addr); }
  if(e.key==='k'){ select(r[Math.max(i-1,0)].addr); }
  if(e.key==='w' && sel){ toggleWatch(sel); }
  if(e.key==='e' && sel){ exportOne(sel); }
  if(e.key==='Escape'){ $('#main').classList.remove('detail'); }
});

/* ---------- boot ---------- */
async function boot(){
  await loadBaseline();
  loadDelta();
  drawCounts(); drawStatus();
  render();
  setInterval(pump, 700);
  setInterval(()=>{                       // paint tick: apply whatever the feeds merged
    if(DIRTY.size || NEWSEEN.size !== paintedNew){ paint(); drawCounts(); paintedNew = NEWSEEN.size; }
    if(sel && DIRTY.has(sel)){ const x=T.get(sel); if(x) updateDetail(x); }
    DIRTY.clear();
  }, 1000);
  setInterval(drawStatus, 30000);         // keep the snapshot age honest
  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden){ pump(); if(tab==='graph') gStart(); }
  });
  window.addEventListener('resize', ()=>{ if(tab==='graph') buildGraph(); });
}
let paintedNew = 0;
$('#foot').innerHTML = 'live from geckoterminal + dexscreener · holders, graduation and safety from the pools.trade snapshot · not financial advice';
boot();
