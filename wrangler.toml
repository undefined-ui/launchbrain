# Cloudflare Worker config: one worker serves the whole product.
# GET requests are answered from the repo's static files (the terminal and
# its data/), everything else falls through to worker/chat.js — the chat
# relay. Git-connected: every push redeploys. The GROQ_API_KEY secret is
# set in the Cloudflare dashboard, never here.
name = "launchbrain"
main = "worker/chat.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./"
not_found_handling = "none"

[observability.logs]
enabled = true

# GitHub's own cron for this repo fires with hours of jitter, which punches
# holes in the trades ledger. Cloudflare's cron is punctual: every firing
# dispatches the update-data workflow (needs the GITHUB_TOKEN secret; the
# scheduled handler is a no-op without it).
[triggers]
crons = ["*/20 * * * *"]
