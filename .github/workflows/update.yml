name: update data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# a run can take several minutes against the rate limiter; never overlap
concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch launch data
        env:
          PYTHONUNBUFFERED: "1"
          LB_BUDGET_S: "780"   # stop the sweep and write well before the job timeout
        run: python3 scripts/fetch.py
      - name: Commit if changed
        run: |
          git config user.name "launchbrain-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: $(date -u +%H:%MZ)"
          git push
