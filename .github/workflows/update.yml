name: update data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# a run can take several minutes against the rate limiter; never overlap
concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch launch data
        env:
          PYTHONUNBUFFERED: "1"
          LB_BUDGET_S: "300"   # every stage is time-budgeted; the whole run must
                               # finish well inside the 30-minute dispatch cadence
        run: python3 scripts/fetch.py
      - name: Commit if changed
        run: |
          git config user.name "launchbrain-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet && exit 0
          git commit -m "data: $(date -u +%H:%MZ)"
          # main may have moved while the harvest ran. On a data-vs-data
          # conflict our files win: each run writes complete fresh snapshots
          # (-X theirs = the commit being replayed, i.e. ours).
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main || git rebase --abort
            git push && exit 0
            sleep 10
          done
          exit 1
